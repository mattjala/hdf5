# DEBUG ONLY: investigate empty text export from H5export_* on macOS (PR #6882)
name: debug macOS export

on:
  workflow_dispatch:
  push:
    branches: [ debug_macos_export ]

permissions:
  contents: read

jobs:
  junit:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-15, macos-26 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # latest
        with:
          ninjaVersion: latest

      - name: Configure
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -C $GITHUB_WORKSPACE/config/cmake/cacheinit.cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DHDF5_BUILD_JAVA:BOOL=ON \
            -DHDF5_ENABLE_JNI:BOOL=ON \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DHDF5_BUILD_DOC:BOOL=OFF \
            -DHDF5_BUILD_EXAMPLES:BOOL=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
            $GITHUB_WORKSPACE
        shell: bash

      - name: Build Java
        run: cmake --build . --parallel 4 --target java/all
        working-directory: ${{ runner.workspace }}/build

      - name: JUnit-TestH5 alone
        run: ctest -R '^JUnit-TestH5$' -V
        working-directory: ${{ runner.workspace }}/build
        continue-on-error: true

      - name: All JUnit tests in parallel (as in CI)
        run: ctest -R '^JUnit-' --parallel 2 --output-on-failure
        working-directory: ${{ runner.workspace }}/build
        continue-on-error: true
